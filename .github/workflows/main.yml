name: Build & Release (Android + Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 1) Android: eliminar android/ obsoleto y regenerar
  # ------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # --- SOLUCIÓN: borrar la carpeta android antigua ---
      - name: Eliminar carpeta android obsoleta
        run: rm -rf android

      - name: Regenerar estructura de plataformas
        run: flutter create .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Limpiar caché de compilación
        run: flutter clean

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: credentia-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ------------------------------------------------------------
  # 2) Windows: eliminar windows/ obsoleto y regenerar
  # ------------------------------------------------------------
  build-windows:
    name: Build Windows ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # --- SOLUCIÓN: borrar la carpeta windows antigua (PowerShell) ---
      - name: Eliminar carpeta windows obsoleta
        run: Remove-Item -Recurse -Force windows
        shell: pwsh

      - name: Regenerar estructura de plataformas
        run: flutter create .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Limpiar caché de compilación
        run: flutter clean

      - name: Compilar Windows (release)
        run: flutter build windows --release

      - name: Comprimir carpeta de salida
        run: 7z a -mx9 windows-release.zip ./build/windows/x64/runner/Release/*

      - name: Subir ZIP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: credentia-windows-zip
          path: windows-release.zip

  # ------------------------------------------------------------
  # 3) Publicar Release con ambos archivos
  # ------------------------------------------------------------
  release:
    name: Publicar Release en GitHub
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: credentia-android-apk
          path: ./dist

      - name: Descargar ZIP de Windows
        uses: actions/download-artifact@v4
        with:
          name: credentia-windows-zip
          path: ./dist

      - name: Crear Release y adjuntar archivos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/app-release.apk
            ./dist/windows-release.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Credentia_Exp ${{ github.ref_name }}

            - **Android**: `app-release.apk`
            - **Windows**: `windows-release.zip` (descomprimir y ejecutar el .exe)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
